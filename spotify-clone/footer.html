<html>
<head>
<title>footer</title>
<link rel="stylesheet" href="spotify_style.css">
</head>
<body style="background-color: black;">
<div style="display: inline-block;">
<img class="cover" src="laila_majnu_cover.png">
<p>O Meri Laila<br><span class="Artist">Mannan Bajaj</span></p>
<img class="icons" style="width: 18px;height: 18px" src="plus_circle_icon.png">
</div>
<div style="text-align: center" class="center"><img src="shuffle_icon.png" class="icons">
<img src="previous_icon.png" class="icons">
<input type="checkbox" id="playPause" class="play-pause-checkbox">
<label for="playPause" class="play-pause-label"></label>
<img src="next_icon.png" class="icons">
<img src="repeat_icon.png" style="height: 20px;width: 20px;" class="icons">
<br><input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
</div>

<div style="text-align: right; height: auto; width: auto; display: inline-block;position: absolute; right: 0;margin-top: 15px;margin-right: 30px;margin-left: 15px;">
<img src="full_screen_icon.png" class="footer_icons">
<img src="miniplayer_icon.png" class="footer_icons">
<img src="smart-tv.png" class="footer_icons">
<img src="queue_icon.png" class="icons_right" style="width: 20px;height: 20px;">
<img src="lyrics_icon.png" class="footer_icons">
</div>



</body>
</html>
