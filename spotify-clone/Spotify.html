<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Web Player: Music for everyone</title>
    <style>
        /* Reset body margin and padding */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header styling */
        header {
            height: 65px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            font-size: 18px;
        }

        /* Main content area with two iframes */
        .main-content {
            display: flex;
            flex: 1; /* Expand to fill available space between header and footer */
        }

        .main-content iframe:first-child {
    flex: 3;
}

.main-content iframe:last-child {
    flex: 7;
}

        /* Footer styling */
        footer {
            height: 85px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            font-size: 18px;
        }
.nowPlaying{height: 60px;
width: 60px;
margin: 10px;
display: flex;
vertical-align: middle;
}
footer>iframe{
flex: 1;
}
header iframe {
    width: 100%;
    height: 100%;
    border: none; /* Optional: removes the border around the iframe */
}
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
<iframe src="header.html"></iframe>
    </header>

    <!-- Main Content Section with Two Columns -->
    <div class="main-content">
        <iframe src="left.html" title="Left Frame"></iframe>
        <iframe src="right.html" title="Right Frame"></iframe>
    </div>

    <!-- Footer Section -->
    <footer>
<iframe src="footer.html"></iframe>
    </footer>
<script src="script.js"></script>
</body>
</html>
